name: Run Runtime Repair V4.3

on:
  push:
    paths:
      - ".github/workflows/run-runtime-repair-v43.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deterministic dependencies
        run: npm ci

      - name: Apply runtime repairs
        run: python scripts/repair-runtime-v43.py

      - name: Validate 3D assets
        run: node scripts/validate-assets.mjs

      - name: Build repaired site
        run: npm run build

      - name: Commit repaired runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/SiteLayout.astro src/components/NioSpace.astro src/components/NioModelLayer.astro src/components/NioAssetGallery3D.astro
          if git diff --cached --quiet; then
            echo 'Runtime already repaired.'
            exit 0
          fi
          git commit -m 'Repair V4.2 3D runtime reliability'
          git push
