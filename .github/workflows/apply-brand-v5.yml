name: Apply Nolan Orbit Brand V5

on:
  push:
    paths:
      - ".github/workflows/apply-brand-v5.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  brand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply brand migration
        run: python scripts/apply-brand-v5.py

      - name: Validate assets
        run: npm run verify

      - name: Build branded site
        run: npm run build

      - name: Commit brand migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/SiteLayout.astro src/components/FocusGallery.astro src/components/NioModelLayer.astro src/components/NioAssetGallery3D.astro src/styles/brand-v5.css
          if git diff --cached --quiet; then
            echo 'Brand already applied.'
            exit 0
          fi
          git commit -m 'Apply Nolan Orbit vector identity across site'
          git push
