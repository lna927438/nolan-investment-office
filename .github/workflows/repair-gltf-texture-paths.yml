name: Repair GLTF Texture Paths

on:
  push:
    paths:
      - ".github/workflows/repair-gltf-texture-paths.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Match Poly Haven glTF texture directory layout
        shell: bash
        run: |
          set -euo pipefail
          for dir in public/models/classic_laptop public/models/bunsen_burner public/models/power_box_01 public/models/jug_01; do
            mkdir -p "$dir/textures"
            shopt -s nullglob
            for image in "$dir"/*.jpg "$dir"/*.png "$dir"/*.webp; do
              git mv "$image" "$dir/textures/$(basename "$image")"
            done
          done
      - name: Commit repaired model paths
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then
            echo 'No texture path changes.'
            exit 0
          fi
          git commit -m 'Repair GLTF texture directory paths'
          git push
