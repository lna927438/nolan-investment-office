name: Ingest V4.2 3D Assets

on:
  push:
    paths:
      - ".github/workflows/asset-ingest-3d.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download CC0 Poly Haven assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path
          from urllib.parse import urlparse

          API = 'https://api.polyhaven.com/files/{}'
          root = Path('public')
          model_slugs = ['classic_laptop', 'bunsen_burner', 'power_box_01', 'jug_01']
          hdri_slug = 'machine_shop_03'

          def get_json(url):
              req = urllib.request.Request(url, headers={'User-Agent':'NolanInvestmentOffice/1.0'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.load(r)

          def download(url, target):
              target.parent.mkdir(parents=True, exist_ok=True)
              req = urllib.request.Request(url, headers={'User-Agent':'NolanInvestmentOffice/1.0'})
              with urllib.request.urlopen(req, timeout=120) as r, open(target, 'wb') as f:
                  while True:
                      chunk = r.read(1024 * 1024)
                      if not chunk:
                          break
                      f.write(chunk)
              print(target, target.stat().st_size)

          def collect_file_records(node, records=None):
              if records is None:
                  records=[]
              if isinstance(node, dict):
                  if isinstance(node.get('url'), str):
                      records.append(node)
                  for value in node.values():
                      collect_file_records(value, records)
              elif isinstance(node, list):
                  for value in node:
                      collect_file_records(value, records)
              return records

          def choose_resolution(tree, fmt):
              branch = tree.get(fmt, {}) if isinstance(tree, dict) else {}
              if not isinstance(branch, dict) or not branch:
                  return None
              preferred = ['1k', '2k', '4k']
              for res in preferred:
                  if res in branch and isinstance(branch[res], dict):
                      rec = branch[res].get(fmt)
                      if isinstance(rec, dict) and rec.get('url'):
                          return rec, res
              for res, item in branch.items():
                  if isinstance(item, dict):
                      rec = item.get(fmt)
                      if isinstance(rec, dict) and rec.get('url'):
                          return rec, res
              return None

          def ingest_model(slug):
              tree = get_json(API.format(slug))
              chosen = choose_resolution(tree, 'gltf')
              if not chosen:
                  raise RuntimeError(f'No glTF variant found for {slug}; top keys={list(tree)[:20]}')
              rec, res = chosen
              outdir = root / 'models' / slug
              main_name = Path(urlparse(rec['url']).path).name
              download(rec['url'], outdir / main_name)
              includes = collect_file_records(rec.get('include', {}))
              seen = {rec['url']}
              for inc in includes:
                  url = inc['url']
                  if url in seen:
                      continue
                  seen.add(url)
                  name = Path(urlparse(url).path).name
                  download(url, outdir / name)
              manifest = {
                  'slug': slug,
                  'resolution': res,
                  'entry': main_name,
                  'source': f'https://polyhaven.com/a/{slug}',
                  'license': 'CC0'
              }
              (outdir / 'manifest.json').write_text(json.dumps(manifest, indent=2), encoding='utf-8')

          def ingest_hdri(slug):
              tree = get_json(API.format(slug))
              branch = tree.get('hdri', {})
              rec = None
              res = None
              for candidate in ['1k', '2k']:
                  item = branch.get(candidate, {}) if isinstance(branch, dict) else {}
                  for ext in ['hdr', 'exr']:
                      maybe = item.get(ext) if isinstance(item, dict) else None
                      if isinstance(maybe, dict) and maybe.get('url'):
                          rec, res = maybe, candidate
                          break
                  if rec: break
              if not rec:
                  raise RuntimeError(f'No HDRI variant found for {slug}; top keys={list(tree)[:20]}')
              ext = Path(urlparse(rec['url']).path).suffix or '.hdr'
              out = root / 'hdri' / f'{slug}_{res}{ext}'
              download(rec['url'], out)
              (root / 'hdri' / 'manifest.json').write_text(json.dumps({
                  'slug': slug, 'resolution': res, 'entry': out.name,
                  'source': f'https://polyhaven.com/a/{slug}', 'license': 'CC0'
              }, indent=2), encoding='utf-8')

          for slug in model_slugs:
              ingest_model(slug)
          ingest_hdri(hdri_slug)
          PY

      - name: Commit self-hosted 3D assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/models public/hdri
          if git diff --cached --quiet; then
            echo 'No new 3D assets.'
            exit 0
          fi
          git commit -m 'Ingest self-hosted V4.2 CC0 3D assets'
          git push
